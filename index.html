<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found Portal</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Dexie.js for IndexedDB storage -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <!-- HTML5 QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- ======================================================================= -->
    <!-- CSS SECTION START -->
    <!-- ======================================================================= -->
    <style>
        :root { 
            --primary: #6366f1; 
            --primary-hover: #4f46e5;
            --bg: #f8fafc; 
            --card-bg: #ffffff;
            --text: #0f172a; 
            --text-muted: #64748b;
            --lost: #e11d48; 
            --lost-bg: #fff1f2;
            --found: #16a34a; 
            --found-bg: #f0fdf4;
            --border: #e2e8f0;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 0 1px 1px rgba(0, 0, 0, 0.05);
        }
        
        /* ANIMATION KEYFRAMES */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); margin: 0; color: var(--text); padding-bottom: 100px; -webkit-font-smoothing: antialiased; }
        
        /* LANDING PAGE */
        #landingPage { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            text-align: center; 
            padding: 24px; 
            background: linear-gradient(-45deg, #6366f1, #8b5cf6, #3b82f6, #6366f1);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: white;
        }
        .hero-badge { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 50px; font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 20px; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.2); }
        .hero-title { font-size: 3.5rem; font-weight: 900; margin: 0 0 12px 0; letter-spacing: -1px; text-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .hero-subtitle { font-size: 1.15rem; opacity: 0.9; margin-bottom: 40px; max-width: 450px; line-height: 1.5; }
        .open-btn { 
            background: white; color: var(--primary); border: none; padding: 18px 48px; 
            border-radius: 50px; font-size: 1.1rem; font-weight: 800; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .open-btn:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        
        #mainApp { display: none; max-width: 540px; margin: 0 auto; }
        
        /* HEADER & NAV */
        header { 
            background: linear-gradient(135deg, var(--primary), #4f46e5); 
            padding: 35px 20px 65px 20px; 
            text-align: center; 
            color: white; 
            font-size: 1.6rem; 
            font-weight: 900; 
            letter-spacing: -0.5px;
            border-radius: 0 0 var(--radius-lg) var(--radius-lg); 
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.25); 
        }
        .nav-tabs { 
            display: flex; 
            gap: 8px; 
            padding: 6px; 
            max-width: 380px; 
            margin: -35px auto 25px auto; 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(12px);
            border-radius: var(--radius-md); 
            box-shadow: 0 8px 25px rgba(0,0,0,0.06); 
            border: 1px solid rgba(255,255,255,0.8);
        }
        .tab-btn { flex: 1; padding: 12px; cursor: pointer; border: none; border-radius: 10px; background: transparent; font-weight: 700; color: var(--text-muted); font-size: 0.9rem; transition: all 0.25s ease; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
        
        .page { display: none; padding: 0 16px; animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
        .page.active { display: block; }

        /* FORMS & INPUTS */
        .card-form { background: var(--card-bg); padding: 28px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        input, textarea, select { width: 100%; padding: 14px 16px; margin: 6px 0 14px 0; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: #f8fafc; font-size: 0.95rem; font-family: inherit; color: var(--text); box-sizing: border-box; transition: all 0.2s ease; }
        input:focus, textarea:focus, select:focus { border-color: var(--primary); background: #fff; outline: none; box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }
        label { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); display: block; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .submit-btn { background: var(--primary); color: white; border: none; padding: 16px; cursor: pointer; width: 100%; border-radius: var(--radius-sm); font-weight: 800; font-size: 1rem; margin-top: 10px; transition: all 0.2s; box-shadow: 0 4px 12px rgba(99,102,241,0.25); }
        .submit-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        
        /* FEED CARDS */
        .card { background: var(--card-bg); padding: 22px; margin-bottom: 20px; border-radius: var(--radius-md); border: 1px solid var(--border); position: relative; box-shadow: var(--shadow); transition: transform 0.2s; animation: fadeIn 0.4s ease-out; }
        .card:hover { transform: translateY(-2px); }
        .card.lost { border-left: 6px solid var(--lost); }
        .card.found { border-left: 6px solid var(--found); }
        
        .type-badge { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; color: white; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card.lost .type-badge { background: var(--lost); }
        .card.found .type-badge { background: var(--found); }
        
        .item-name { font-size: 1.25rem; font-weight: 800; display: block; margin-bottom: 8px; color: var(--text); }
        .item-phone { display: inline-flex; align-items: center; gap: 6px; background: #e0e7ff; color: var(--primary); padding: 6px 14px; border-radius: 20px; font-weight: 700; text-decoration: none; margin-top: 12px; font-size: 0.85rem; transition: 0.2s; }
        .item-phone:hover { background: #c7d2fe; }
        
        .delete-btn { position: absolute; top: 20px; right: 20px; background: #fee2e2; color: #ef4444; border: none; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 0.75rem; font-weight: 700; transition: 0.2s; }
        .delete-btn:hover { background: #fecaca; }
        
        .claim-btn { margin-top: 12px; margin-left: 8px; padding: 8px 14px; border-radius: 10px; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 700; transition: 0.2s; }
        
        .filters { display: flex; gap: 8px; margin-bottom: 20px; }
        .filter-btn { padding: 8px 18px; border-radius: 30px; border: 1.5px solid var(--border); background: white; cursor: pointer; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); transition: 0.2s; }
        .filter-btn.active { background: var(--text); color: white; border-color: var(--text); }

        /* Search Bar */
        .search-box { width: 100%; padding: 14px 18px; margin-bottom: 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); box-sizing: border-box; background: white; font-size: 0.95rem; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }

        /* Camera Styles */
        #camera-container { width: 100%; margin: 10px 0; display: none; border-radius: var(--radius-sm); overflow: hidden; background: #000; border: 2px solid var(--border); }
        .cam-control-btn { background: #334155; color: white; border: none; padding: 12px; border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; margin-top: 6px; width: 100%; font-size: 0.9rem; transition: 0.2s; }
        .cam-control-btn:hover { background: #1e293b; }

        /* New Feature: Claim Pass Modal Popup */
        #modalOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 999; padding: 20px; }
        .modal-card { background: white; padding: 30px; border-radius: var(--radius-lg); max-width: 380px; width: 100%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: fadeIn 0.3s ease; }
    </style>
    <!-- ======================================================================= -->
    <!-- CSS SECTION END -->
    <!-- ======================================================================= -->
</head>
<body onload="refreshFeed()">

<!-- LANDING PAGE -->
<div id="landingPage">
    <div class="hero-badge">Campus & Community</div>
    <h1 class="hero-title">Lost & Found</h1>
    <p class="hero-subtitle">The modern way to report, discover, and claim misplaced belongings instantly.</p>
    <button class="open-btn" onclick="openApp()">Open Portal ✨</button>
</div>

<!-- MAIN APP CONTAINER -->
<div id="mainApp">
    <header>Lost & Found Portal</header>
    
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="showPage('submitPage', this)">➕ Submit Item</button>
        <button class="tab-btn" onclick="showPage('feedPage', this)">📋 Live Feed</button>
    </div>

    <!-- SUBMIT PAGE -->
    <div id="submitPage" class="page active">
        <div class="card-form">
            <label>Report Type</label>
            <select id="type">
                <option value="lost">🔴 LOST ITEM</option>
                <option value="found">🟢 FOUND ITEM</option>
            </select>
            
            <label>Item Name</label>
            <input type="text" id="name" placeholder="e.g., MacBook Pro, Blue Hydroflask">
            
            <label>Location</label>
            <input type="text" id="location" placeholder="e.g., Library 2nd Floor">
            
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="e.g., +1 (555) 019-2834">
            
            <div class="form-row">
                <div>
                    <label>Date</label>
                    <input type="date" id="date">
                </div>
                <div>
                    <label>Time</label>
                    <input type="time" id="time">
                </div>
            </div>
            
            <!-- Real Camera Integration Section -->
            <label>Item Photo (Live Camera)</label>
            <button type="button" class="cam-control-btn" onclick="startCamera()">📷 Open Live Camera</button>
            <div id="camera-container"></div>
            <button type="button" id="capture-btn" class="cam-control-btn" style="display:none; background: var(--lost);" onclick="captureSnapshot()">📸 Take Photo Snapshot</button>
            <div id="snapshot-preview" style="margin-top: 10px; text-align: center;"></div>
            <input type="hidden" id="capturedImageData">

            <label>Description</label>
            <textarea id="desc" placeholder="Provide distinct features, color, or marks..." rows="2"></textarea>
            
            <button class="submit-btn" onclick="addItem()">Post Item to Feed 🚀</button>
        </div>
    </div>

    <!-- FEED PAGE -->
    <div id="feedPage" class="page">
        <input type="text" class="search-box" id="searchBar" placeholder="🔍 Search items by name or description..." onkeyup="refreshFeed()">
        
        <div class="filters">
            <button class="filter-btn active" onclick="updateFilter('all', this)">All Items</button>
            <button class="filter-btn" onclick="updateFilter('lost', this)">Lost Only</button>
            <button class="filter-btn" onclick="updateFilter('found', this)">Found Only</button>
        </div>
        
        <div id="feed"></div>
    </div>
</div>

<!-- FEATURE SUGGESTION MODAL: Digital Claim Pass & Verification QR -->
<div id="modalOverlay" onclick="closeClaimPass(event)">
    <div class="modal-card" id="modalCard">
        <div style="font-size:2.5rem; margin-bottom:10px;">🎟️</div>
        <h3 style="margin:0 0 8px 0; font-size:1.3rem;">Digital Claim Pass</h3>
        <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:20px;">Show this secure claim badge to security desk officers for item verification.</p>
        <div id="passContent" style="background:#f8fafc; padding:15px; border-radius:12px; border:1px dashed var(--border); margin-bottom:20px; text-align:left; font-size:0.9rem;"></div>
        <button class="submit-btn" style="margin-top:0;" onclick="document.getElementById('modalOverlay').style.display='none'">Close Pass</button>
    </div>
</div>

    <!-- ======================================================================= -->
    <!-- JAVASCRIPT SECTION START -->
    <!-- ======================================================================= -->
<script>
    // Initialize Dexie Database
    const db = new Dexie('LostFoundDatabase');
    db.version(1).stores({
        items: '++id, type, name, location, phone, date, time, desc, image, status'
    });

    let currentFilter = 'all';
    let html5QrCode = null;

    function openApp() {
        document.getElementById('landingPage').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
    }

    function showPage(pageId, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        btn.classList.add('active');
        
        // Stop camera if leaving the submit page
        if(pageId !== 'submitPage' && html5QrCode) {
            stopCamera();
        }
    }

    // Camera Management Functions
    function startCamera() {
        const container = document.getElementById('camera-container');
        container.style.display = 'block';
        document.getElementById('capture-btn').style.display = 'block';

        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("camera-container");
        }

        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 220, height: 220 } },
            (decodedText, decodedResult) => {},
            (errorMessage) => {}
        ).catch(err => {
            alert("Unable to access camera: " + err);
        });
    }

    function stopCamera() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('camera-container').style.display = 'none';
                document.getElementById('capture-btn').style.display = 'none';
            }).catch(err => {
                console.error("Failed to stop camera", err);
            });
        }
    }

    function captureSnapshot() {
        const videoElement = document.querySelector('#camera-container video');
        if (!videoElement) {
            return alert("Camera feed not active!");
        }

        const canvas = document.createElement('canvas');
        canvas.width = videoElement.videoWidth || 640;
        canvas.height = videoElement.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        document.getElementById('capturedImageData').value = dataUrl;
        document.getElementById('snapshot-preview').innerHTML = `<img src="${dataUrl}" style="width:100%; border-radius:12px; max-height:180px; object-fit:cover; border: 2px solid var(--border);">`;
        
        stopCamera();
    }

    async function addItem() {
        const name = document.getElementById('name').value;
        const location = document.getElementById('location').value;
        const imageData = document.getElementById('capturedImageData').value;
        
        if(!name || !location) return alert("Please fill up the Item Name and Location!");

        const item = {
            type: document.getElementById('type').value,
            name: name,
            location: location,
            phone: document.getElementById('phone').value,
            date: document.getElementById('date').value,
            time: document.getElementById('time').value,
            desc: document.getElementById('desc').value,
            image: imageData || null,
            status: 'unclaimed'
        };

        try {
            await db.items.add(item);
            alert("Posted successfully!");
            document.querySelectorAll('input:not([type=hidden]), textarea').forEach(el => el.value = '');
            document.getElementById('snapshot-preview').innerHTML = '';
            document.getElementById('capturedImageData').value = '';
            refreshFeed();
            showPage('feedPage', document.querySelectorAll('.tab-btn')[1]);
        } catch (error) {
            console.error("Error saving item:", error);
            alert("Failed to save item to database.");
        }
    }

    function updateFilter(type, btn) {
        currentFilter = type;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        refreshFeed();
    }

    async function toggleStatus(id) {
        let item = await db.items.get(id);
        if (item) {
            const newStatus = (item.status === 'claimed') ? 'unclaimed' : 'claimed';
            await db.items.update(id, { status: newStatus });
            refreshFeed();
            
            // Feature Suggestion Action: Trigger Claim Pass Modal if claimed!
            if(newStatus === 'claimed') {
                showClaimPass(item);
            }
        }
    }

    // New Suggested Feature: Show Digital Verification Claim Pass
    function showClaimPass(item) {
        const passContent = document.getElementById('passContent');
        passContent.innerHTML = `
            <strong>Item:</strong> ${item.name}<br>
            <strong>Location:</strong> ${item.location}<br>
            <strong>Contact:</strong> ${item.phone || 'N/A'}<br>
            <strong>Token ID:</strong> #LF-${item.id}-${Math.floor(Math.random()*9000+1000)}<br>
            <div style="margin-top:10px; text-align:center; font-size:0.75rem; color:var(--text-muted);">Status: Verified Secure Claim</div>
        `;
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeClaimPass(e) {
        if(e.target.id === 'modalOverlay') {
            document.getElementById('modalOverlay').style.display = 'none';
        }
    }

    async function refreshFeed() {
        const query = (document.getElementById('searchBar')?.value || '').toLowerCase();
        let items = await db.items.reverse().toArray();
        
        const filtered = items.filter(i => {
            const matchType = (currentFilter === 'all' || i.type === currentFilter);
            const matchSearch = (i.name || '').toLowerCase().includes(query) || (i.desc || '').toLowerCase().includes(query);
            return matchType && matchSearch;
        });
        render(filtered);
    }

    function render(items) {
        const feed = document.getElementById('feed');
        feed.innerHTML = items.length ? items.map(i => `
            <div class="card ${i.type}" style="opacity: ${i.status === 'claimed' ? '0.65' : '1'}">
                <button class="delete-btn" onclick="deleteItem(${i.id})">Delete</button>
                <span class="type-badge">${i.type}</span>
                <span class="item-name">${i.name}</span>
                ${i.image ? `<img src="${i.image}" style="width:100%; border-radius:12px; margin-bottom:12px; max-height:220px; object-fit:cover;">` : ''}
                <div style="font-size: 0.85rem; color:var(--text-muted); margin-bottom:4px;">📍 <strong>Location:</strong> ${i.location}</div>
                <div style="font-size: 0.85rem; color:var(--text-muted);">🕒 <strong>Date/Time:</strong> ${i.date || 'N/A'} ${i.time || ''}</div>
                <p style="font-size: 0.9rem; color:#334155; margin:12px 0; line-height:1.4;">${i.desc || 'No description provided.'}</p>
                ${i.phone ? `<a href="tel:${i.phone}" class="item-phone">📞 ${i.phone}</a>` : ''}
                <br>
                <button class="claim-btn" style="background: ${i.status === 'claimed' ? '#d1fae5' : '#e0e7ff'}; color: ${i.status === 'claimed' ? '#065f46' : '#4338ca'};" onclick="toggleStatus(${i.id})">
                    ${i.status === 'claimed' ? '✅ Item Claimed (View Pass)' : 'Mark as Claimed'}
                </button>
            </div>
        `).join('') : '<p style="text-align:center; color:var(--text-muted); margin-top:40px; font-weight:600;">No items found.</p>';
    }

    async function deleteItem(id) {
        if(confirm("Are you sure you want to delete this post?")) {
            await db.items.delete(id);
            refreshFeed();
        }
    }
</script>
    <!-- ======================================================================= -->
    <!-- JAVASCRIPT SECTION END -->
    <!-- ======================================================================= -->
</body>
</html>
